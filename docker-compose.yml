services:
  web:
    build:
      context: ./
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.kdsx-web.entrypoints=web, websecure
      - traefik.http.routers.kdsx-web.rule=Host(`kdsx.uz`) || Host(`www.kdsx.uz`)
      - traefik.http.services.kdsx-web.loadbalancer.server.port=80
      - traefik.http.middlewares.wwwredirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.wwwredirect.redirectregex.replacement=https://$${1}
      - traefik.http.routers.kdsx-web.middlewares=wwwredirect
    networks:
      - app

  octopos-web:
    build:
      context: ./
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.octopos-web.entrypoints=web, websecure
      - traefik.http.routers.octopos-web.rule=Host(`octopos.uz`) || Host(`www.octopos.uz`)
      - traefik.http.services.octopos-web.loadbalancer.server.port=80
      - traefik.http.middlewares.wwwredirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.wwwredirect.redirectregex.replacement=https://$${1}
      - traefik.http.routers.octopos-web.middlewares=wwwredirect
    networks:
      - app

networks:
  app:
    name: app
    external: true
